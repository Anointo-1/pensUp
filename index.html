<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO & Web Metadata -->
    <title>PensUp pro</title>
    <meta name="description" content="A handwritten notebook-style real-time study group and chat application. Scribble notes, customize doodles, and collaborate cleanly.">
    <meta name="theme-color" content="#fdfaf6">

    <!-- Open Graph -->
    <meta property="og:title" content="PensUp pro">
    <meta property="og:description" content="Real-time group chat with a handwritten paper aesthetic.">

    <!-- Inline Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-full flex flex-col relative overflow-hidden text-lg select-none">

    <!-- Red Notebook Margins -->
    <div class="absolute top-0 bottom-0 left-8 w-[2px] z-0 pointer-events-none transition-colors duration-500 margin-line"></div>
    <div class="absolute top-0 bottom-0 left-10 w-[2px] z-0 pointer-events-none transition-colors duration-500 margin-line"></div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 p-4 transition-opacity duration-300">
        <div class="bg-white p-6 sketched-border w-full max-w-sm flex flex-col gap-4 animate-pop relative text-slate-800">
            <div id="auth-loading" class="hidden absolute inset-0 bg-white/95 z-10 flex flex-col items-center justify-center rounded-xl">
                <div class="loader mb-2 text-indigo-500"></div><span class="font-bold">Writing in registry...</span>
            </div>
            <h2 class="font-['Permanent_Marker'] text-3xl text-center mb-1">Join PensUp pro</h2>
            <div id="auth-error" class="text-rose-600 text-sm font-bold hidden text-center bg-rose-50 p-2 border border-rose-200 rounded"></div>
            <input type="text" id="auth-username" placeholder="Username (no spaces)" class="w-full p-2 sketched-border text-xl outline-none lowercase">
            <input type="password" id="auth-password" placeholder="Password (min 6 chars)" class="w-full p-2 sketched-border text-xl outline-none">
            <div class="flex gap-2 mt-2">
                <button id="btn-login" class="flex-1 bg-indigo-500 text-white p-2 sketched-border-alt hover:bg-indigo-600 font-bold text-xl">Login</button>
                <button id="btn-register" class="flex-1 bg-emerald-500 text-white p-2 sketched-border-alt hover:bg-emerald-600 font-bold text-xl">Create</button>
            </div>
        </div>
    </div>

    <!-- LAUNCH SCREEN -->
    <div id="launch-screen" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center p-6 bg-black/40 backdrop-blur-sm">
        <div class="bg-yellow-50 p-6 sketched-border w-full max-w-md flex flex-col gap-5 animate-pop text-slate-800 relative">
            <div class="absolute -top-3 -left-3 bg-slate-800 text-white text-sm font-bold px-3 py-1 sketched-border rotate-[-10deg] shadow-md z-10">v1.0</div>
            <div class="flex justify-between items-center border-b-2 border-slate-300/50 pb-2 pl-6">
                <select id="theme-selector" class="text-sm bg-white sketched-border px-2 py-1 outline-none cursor-pointer">
                    <option value="">Classic Notebook</option><option value="theme-halloween">🎃 Spooky Book</option><option value="theme-xmas">🎄 Festive Book</option>
                </select>
                <button id="btn-logout-launch" class="text-lg font-bold text-rose-500 hover:text-rose-700">Logout ✖</button>
            </div>
            <div class="text-center">
                <h1 class="text-4xl font-['Permanent_Marker'] text-indigo-600" id="greeting-text">Good Day!</h1>
                <div class="relative group mt-3">
                    <div class="bg-white p-3 sketched-border-alt text-xl text-center italic shadow-sm">"<span id="launch-board-text">Welcome to the study group!</span>"</div>
                    <button id="btn-edit-board" class="hidden absolute -top-3 -right-3 bg-rose-400 text-white w-8 h-8 rounded-full sketched-border text-sm flex items-center justify-center hover:scale-110">✏️</button>
                </div>
            </div>
            <div class="bg-white p-3 sketched-border flex flex-col gap-1">
                <p class="font-['Permanent_Marker'] text-slate-400 text-lg">My ID Card</p>
                <div class="flex items-center gap-3">
                    <button id="btn-open-emoji-picker" class="text-5xl hover:scale-110 transition-transform bg-slate-100 p-2 sketched-border" title="Tap to choose doodle">👤</button>
                    <div class="flex-1">
                        <div class="font-bold text-2xl" id="launch-username">User</div>
                        <input type="text" id="launch-bio" placeholder="Scribble a bio..." class="w-full bg-transparent border-b-2 border-slate-300 outline-none text-lg text-slate-600 focus:border-indigo-400 italic">
                    </div>
                </div>
            </div>
            <button id="btn-enter-chat" class="w-full bg-emerald-500 text-white p-3 sketched-border text-2xl font-bold hover:bg-emerald-600 hover:-rotate-1 transition-transform">Open Notebook ➔</button>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="app-screen" class="hidden flex-col h-full w-full">
        <header class="w-full pt-6 pb-2 px-4 flex items-center justify-between z-10 paper-mask border-b-2 border-slate-700/20 shrink-0">
            <div class="flex items-center gap-2 ml-10">
                <button id="btn-back-launch" class="text-2xl hover:scale-110">🏠</button>
                <h1 class="font-['Permanent_Marker'] text-2xl ml-2">PensUp pro</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-admin" class="hidden text-xs bg-rose-500 text-white px-2 py-1 sketched-border hover:bg-rose-600 font-bold">Admin</button>
                <div id="user-badge" class="bg-yellow-200 text-yellow-800 text-sm px-2 py-0.5 rounded-full font-bold sketched-border rotate-3">...</div>
            </div>
        </header>

        <main id="chat-wrapper" class="flex-1 relative overflow-hidden flex flex-col z-10 pl-14">
            <div id="chat-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-transparent z-20">
                <div class="loader mb-3 text-indigo-600"></div><span class="font-bold text-xl bg-white/90 text-slate-800 px-4 py-1 sketched-border -rotate-2">Flipping pages...</span>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 relative"></div>
        </main>

        <footer class="p-3 pb-6 sm:pb-4 paper-mask border-t-2 border-slate-700/20 shrink-0 z-20 pl-14">
            <div class="flex items-end gap-2 max-w-2xl mx-auto pr-2">
                <textarea id="message-input" rows="1" placeholder="Scribble a note..." class="flex-1 bg-white/90 sketched-border px-3 py-2 focus:outline-none resize-none text-xl text-slate-800" style="min-height: 48px; max-height: 120px;"></textarea>
                <button id="btn-send" class="p-2 bg-indigo-500 text-white sketched-border-alt shrink-0 text-xl disabled:opacity-50" disabled>➤</button>
            </div>
        </footer>
    </div>

    <!-- EMOJI SELECTION MODAL -->
    <div id="emoji-modal" class="hidden absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white p-5 sketched-border w-full max-w-sm flex flex-col gap-3 animate-pop text-slate-800 relative max-h-[85vh]">
            <div class="flex justify-between items-center border-b-2 border-slate-200 pb-2">
                <h3 class="font-['Permanent_Marker'] text-2xl">Pick Your Doodle</h3>
                <button id="emoji-close" class="text-slate-500 font-bold text-xl hover:text-rose-500">✖</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="custom-emoji-input" maxlength="4" placeholder="Or type any emoji..." class="flex-1 p-2 sketched-border text-center text-xl outline-none">
                <button id="btn-save-custom-emoji" class="bg-indigo-500 text-white px-3 py-1 sketched-border-alt font-bold">Set</button>
            </div>
            <div id="emoji-grid" class="grid grid-cols-6 gap-2 overflow-y-auto p-2 bg-yellow-50 sketched-border max-h-60 text-2xl text-center"></div>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="hidden absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-yellow-100 p-6 sketched-border w-full max-w-xs flex flex-col items-center gap-2 animate-pop text-slate-800 relative rotate-1">
            <button id="profile-close" class="absolute top-2 right-3 text-slate-500 font-bold hover:text-slate-800 text-xl">✖</button>
            <div id="p-modal-emoji" class="text-7xl">👤</div>
            <h3 id="p-modal-name" class="font-['Permanent_Marker'] text-3xl break-all">Name</h3>
            <div class="flex gap-2 items-center mt-1">
                <span id="p-modal-role" class="text-sm font-bold px-2 py-0.5 rounded bg-indigo-200 text-indigo-800 sketched-border-alt">Role</span>
            </div>
            <p id="p-modal-bio" class="text-center text-slate-600 font-bold text-xl mt-2 break-words max-w-full">"No bio set"</p>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="hidden absolute inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-white p-5 sketched-border flex flex-col gap-3 w-full max-w-md max-h-[80vh] text-slate-800">
            <div class="flex justify-between items-center border-b-2 border-slate-200 pb-2">
                <h3 class="font-['Permanent_Marker'] text-2xl text-rose-600">Admin Control</h3>
                <button id="admin-close" class="text-slate-500 font-bold text-xl">✖</button>
            </div>
            <div id="admin-user-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- External Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
